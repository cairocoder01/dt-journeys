<rect x="968" y="966" width="144" height="42" rx="5" fill="#2a2a2a" stroke="#2a2a2a" stroke-width="1.5"/><text x="1040.0" y="991.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" style="">Save Stage</text>
