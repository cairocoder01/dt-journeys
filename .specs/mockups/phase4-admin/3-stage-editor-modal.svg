<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1500" width="1280" height="1500" font-family="Helvetica, Arial, sans-serif">
<title>Phase 4 — Stage editor (dt-modal)</title>
<rect x="0" y="0" width="1280" height="1500" fill="#f4f4f4"/>
<rect x="0" y="0" width="1280" height="1500" rx="0" fill="#dcdcdc" stroke="none" stroke-width="1.5"/>
<rect x="0" y="0" width="1280" height="64" rx="0" fill="#eaeaea" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="640.0" y="37" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#999" text-anchor="middle" style="font-style:italic;">Underlying page (Journey Editor) dimmed behind modal overlay — unchanged</text>
<rect x="140" y="100" width="1000" height="1340" rx="8" fill="#fff" stroke="#666" stroke-width="2"/>
<text x="168" y="142" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#222" text-anchor="start" style="">Edit Stage — Day 1: Read Genesis 1–3</text>
<text x="1108" y="140" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="normal" fill="#888" text-anchor="middle" style="">✕</text>
<text x="1108" y="156" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#aaa" text-anchor="middle" style="font-style:italic;">close</text>
<line x1="168" y1="158" x2="1112" y2="158" stroke="#e0e0e0" stroke-width="1"/>
<text x="168" y="158" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">  dt-modal — not dt-tile, per architecture decision</text>
<text x="168" y="196" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333" text-anchor="start" style="">Name *</text>
<text x="221.2" y="196" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">(title, required)</text>
<rect x="168" y="204" width="944" height="36" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="180" y="228" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222" text-anchor="start" style="">Day 1 — Read Genesis 1–3</text>
<text x="168" y="260" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333" text-anchor="start" style="">Description</text>
<text x="257.2" y="260" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">(text, short — shown in the collapsed tile summary)</text>
<rect x="168" y="268" width="944" height="36" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="180" y="292" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#222" text-anchor="start" style="">Read the creation account and reflect on God as Creator.</text>
<text x="168" y="324" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333" text-anchor="start" style="">Instructions</text>
<text x="264.4" y="324" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">(textarea — plain text, \n → &lt;br&gt;, no WYSIWYG)</text>
<rect x="168" y="332" width="944" height="120" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="180" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start" style="">Today, read Genesis chapters 1 through 3 slowly. As you read, look for:</text>
<text x="180" y="374" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start" style="">  1. What does this passage show about who God is?</text>
<text x="180" y="394" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start" style="">  2. What does it show about who we are?</text>
<text x="180" y="414" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="start" style="">Come ready to share one observation with your group.</text>
<text x="168" y="472" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333" text-anchor="start" style="">Links</text>
<text x="214.0" y="472" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">(repeating link field — supports [Label](url) syntax)</text>
<text x="168" y="482" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">e.g. [Teaching Guide](https://example.com/guide.pdf) — renders as a friendly “Teaching Guide” link instead of the raw URL. Show a</text>
<text x="168" y="499" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">hint/placeholder + live preview.</text>
<rect x="168" y="514" width="896" height="34" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="178" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333" text-anchor="start" style="">[Teaching Guide](https://example.org/t4t/guide.pdf)</text>
<circle cx="1090" cy="531" r="13" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="1090" y="536.2" font-family="Helvetica, Arial, sans-serif" font-size="12.35" font-weight="600" fill="#b23b3b" text-anchor="middle" style="">X</text>
<rect x="168" y="554" width="896" height="34" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="178" y="576" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333" text-anchor="start" style="">https://example.org/genesis-reading-plan</text>
<circle cx="1090" cy="571" r="13" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="1090" y="576.2" font-family="Helvetica, Arial, sans-serif" font-size="12.35" font-weight="600" fill="#b23b3b" text-anchor="middle" style="">X</text>
<text x="168" y="610" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555" text-anchor="start" style="">+ Add Link</text>
<text x="308" y="624" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#999" text-anchor="start" style="font-style:italic;">Preview:  Teaching Guide  →  example.org/t4t/guide.pdf</text>
<text x="168" y="644" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333" text-anchor="start" style="">Attachments</text>
<text x="257.2" y="644" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">(file_upload — real uploaded files, distinct from Links)</text>
<rect x="168" y="658" width="896" height="34" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<rect x="176" y="665" width="20" height="20" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5"/>
<text x="206" y="680" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#333" text-anchor="start" style="">genesis-discussion-questions.pdf</text>
<circle cx="1090" cy="675" r="13" fill="#ffffff" stroke="#b23b3b" stroke-width="1.5"/><text x="1090" y="680.2" font-family="Helvetica, Arial, sans-serif" font-size="12.35" font-weight="600" fill="#b23b3b" text-anchor="middle" style="">X</text>
<rect x="168" y="698" width="150" height="30" rx="5" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.5"/><text x="243.0" y="717.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#333333" text-anchor="middle" style="">Choose File…</text>
<text x="328" y="718" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#555" text-anchor="start" style="">+ Add Attachment</text>
<text x="168" y="748" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333" text-anchor="start" style="">Related Fields</text>
<text x="278.8" y="748" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">(multi_select — every renderable contacts/groups field)</text>
<rect x="168" y="756" width="944" height="36" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="180" y="780" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#aaa" text-anchor="start" style="font-style:italic;">Search fields…</text>
<rect x="168" y="800" width="190" height="24" rx="12.0" fill="#eeeeee" stroke="#c9c9c9" stroke-width="1.5"/><text x="263.0" y="816.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="middle" style="">Baptized (contacts) ✕</text>
<rect x="368" y="800" width="210" height="24" rx="12.0" fill="#eeeeee" stroke="#c9c9c9" stroke-width="1.5"/><text x="473.0" y="816.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="middle" style="">Milestones (contacts) ✕</text>
<rect x="588" y="800" width="170" height="24" rx="12.0" fill="#eeeeee" stroke="#c9c9c9" stroke-width="1.5"/><text x="673.0" y="816.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#555" text-anchor="middle" style="">Group Type (groups) ✕</text>
<text x="168" y="846" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">Edited here always saves via DT_Posts::update_post() with “required” stripped, regardless of the field's real setting on the main record form.</text>
<text x="168" y="878" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#333" text-anchor="start" style="">Success Action Label</text>
<text x="322.0" y="878" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">(text, optional — renames “Complete”)</text>
<rect x="168" y="886" width="944" height="36" rx="4" fill="#fff" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="180" y="910" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#aaa" text-anchor="start" style="font-style:italic;">e.g. “Read”, “Watched”… (placeholder: “Complete”)</text>
<line x1="168" y1="942" x2="1112" y2="942" stroke="#eee" stroke-width="1"/>
