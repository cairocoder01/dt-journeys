<text x="60" y="774" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">•  Entire page + every action here (create/edit/delete/reorder) must be gated behind the manage_journeys capability, matching Phase 1's roles model.</text>
<text x="60" y="796" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">•  Category filter and the Category field elsewhere are a freeform tags field — offer autocomplete against existing values so authors don't fragment e.g. "T4T" vs "t4t".</text>
<text x="60" y="818" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">•  Route via dt_templates_for_urls at /admin/journeys, following the same pattern as User Management.</text>
