<text x="540" y="842" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">•  Edit icon opens the Stage Editor modal (sheet 3) for that stage; Delete removes it from the journey (confirm dialog).</text>
<text x="540" y="864" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">•  Adding a stage to a journey already in use is safe — records that already started this journey get it backfilled as “Not</text>
<text x="540" y="882" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">    Started” automatically (Phase 2). No migration step needed here.</text>
<text x="540" y="904" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#b23b3b" text-anchor="start" style="font-style:italic;">•  Reorder + stage CRUD should hit the resource-first REST routes, e.g. POST /journeys/{id}/reorder-stages.</text>
