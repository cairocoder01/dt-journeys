<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journeys Mockups</title>
<!--
  Static mockups for the Journeys mobile/tablet UI review.
  Pick a screen with ?s=<name>, e.g. mockups.html?s=phone-list
  Screens: phone-list, phone-list-actions, phone-filters, phone-stages, phone-details-menu,
           phone-stage-menu, phone-stage-edit, phone-new, phone-discard,
           tablet-list, tablet-details, landscape-list, landscape-detail, landscape-stage-edit
-->
<style>
  :root {
    --primary: #3f729b;
    --primary-dark: #2a4d6b;
    --primary-tint: #e8f0f6;
    --bg: #e4e4e4;
    --card: #ffffff;
    --text: #1f1f1f;
    --muted: #666;
    --border: #d6d6d6;
    --danger: #c62828;
    --success: #2e7d32;
    --green: #4caf50;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Helvetica Neue", Helvetica, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.35;
    min-height: 100vh;
  }
  svg.i { width: 22px; height: 22px; fill: currentColor; flex: none; }
  svg.i.sm { width: 16px; height: 16px; }

  /* DT top bar */
  .topbar { background: var(--primary); color: #fff; height: 52px; display: flex; align-items: center; padding: 0 12px; gap: 14px; }
  .topbar .logo { font-weight: 700; letter-spacing: .5px; font-size: 13px; line-height: 1; display: flex; align-items: center; gap: 6px; }
  .topbar .logo b { color: #8bc34a; font-size: 22px; }
  .topbar .logo small { display: block; font-weight: 300; font-size: 11px; letter-spacing: 2px; }
  .topbar .spacer { flex: 1; }
  .topbar .plus { width: 28px; height: 28px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
  .topbar nav { display: flex; gap: 28px; font-weight: 700; margin-left: 12px; }

  /* Page scaffolding */
  .page { padding: 12px 12px 96px; }
  .tablet .page { padding: 16px 16px 40px; }
  .box { background: var(--card); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
  .pad { padding: 16px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid transparent; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.outline { background: #fff; color: var(--primary); border-color: var(--border); }
  .btn.ghost { background: transparent; color: var(--primary); }
  .btn.danger { background: #fff; color: var(--danger); border-color: var(--border); }
  .btn.block { width: 100%; }
  .iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: #555; flex: none; }
  .iconbtn.on { background: #eef2f5; }

  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .titlebar h1 { font-size: 24px; margin: 0; }
  .titlebar h1 .count { font-size: 14px; font-weight: 400; color: var(--muted); margin-left: 6px; }

  .searchrow { display: flex; gap: 8px; margin-bottom: 8px; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; color: #888; }
  .select { display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; color: #888; min-width: 170px; }
  .badge { background: var(--primary); color: #fff; border-radius: 10px; font-size: 12px; padding: 1px 7px; font-weight: 700; }
  .metaline { font-size: 13px; color: var(--muted); margin: 4px 2px 10px; display: flex; justify-content: space-between; align-items: center; }
  .metaline .sort { color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 14px; background: #eef2f5; color: #333; font-size: 13px; }
  .chip.removable { background: var(--primary-tint); color: var(--primary-dark); font-weight: 600; height: 32px; padding: 0 6px 0 12px; }
  .chip.removable svg { width: 18px; height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }

  /* Journey cards (phone list) */
  .jlist { display: flex; flex-direction: column; gap: 8px; }
  .jcard { display: flex; align-items: flex-start; gap: 4px; padding: 14px 4px 14px 16px; min-height: 76px; }
  .jcard .jmain { flex: 1; min-width: 0; }
  .jtitle { font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .jmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  .jmeta .dot::before { content: "·"; margin-right: 6px; }
  .jsub { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .jcard.pressed { outline: 2px solid var(--primary); }

  /* Overlays */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 0 24px; box-shadow: 0 -4px 20px rgba(0,0,0,.2); }
  .sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #ccc; margin: 4px auto 10px; }
  .sheet h3 { margin: 0; padding: 6px 20px 12px; font-size: 16px; border-bottom: 1px solid #eee; }
  .sheet .item { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 20px; font-size: 16px; color: #222; }
  .sheet .item svg { color: #555; }
  .sheet .item.danger, .sheet .item.danger svg { color: var(--danger); }
  .sheet .item.disabled { color: #aaa; }
  .sheet .item.disabled svg { color: #ccc; }
  .sheet .sep { height: 1px; background: #eee; margin: 6px 0; }
  .sheet .section { padding: 14px 20px 4px; }
  .sheet .section h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .opt { display: flex; align-items: center; justify-content: space-between; min-height: 48px; font-size: 16px; border-bottom: 1px solid #f0f0f0; }
  .opt .check { color: var(--primary); }
  .tchip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 14px; background: #fff; }
  .tchip.sel { background: var(--primary-tint); border-color: var(--primary); color: var(--primary-dark); font-weight: 600; }
  .sheet .footer { display: flex; gap: 10px; padding: 16px 20px 0; border-top: 1px solid #eee; margin-top: 14px; }
  .sheet .footer .btn { flex: 1; }

  .menu { position: absolute; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.22); min-width: 220px; padding: 6px 0; z-index: 20; }
  .menu .item { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; font-size: 15px; }
  .menu .item.danger { color: var(--danger); }
  .menu .sep { height: 1px; background: #eee; margin: 4px 0; }

  .dialog { position: fixed; left: 20px; right: 20px; top: 34%; background: #fff; border-radius: 14px; z-index: 11; padding: 22px 20px 16px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .dialog h3 { margin: 0 0 8px; font-size: 18px; }
  .dialog p { margin: 0 0 18px; color: #444; }
  .dialog .actions { display: flex; gap: 10px; justify-content: flex-end; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; background: #2b2b2b; color: #fff; border-radius: 10px; padding: 0 8px 0 18px; min-height: 52px; display: flex; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.3); z-index: 30; white-space: nowrap; }
  .toast .btn { color: #9cc7ea; min-height: 44px; padding: 0 12px; }

  /* Detail page */
  .subbar { display: flex; align-items: center; justify-content: space-between; margin: -4px -4px 2px; }
  .back, .subbar .back { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 0; color: var(--primary); font-weight: 600; background: none; border: 0; font: inherit; font-weight: 600; }
  .ptitle { font-size: 20px; margin: 2px 0 12px; line-height: 1.25; }
  .ptitle small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 4px; }

  .tabs { display: flex; background: #d5d9dd; border-radius: 10px; padding: 3px; margin-bottom: 12px; }
  .tabs a { flex: 1; text-align: center; min-height: 40px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; font-weight: 600; color: #444; }
  .tabs a.active { background: #fff; color: var(--primary-dark); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .tabs .pill { font-size: 12px; background: #bfc7ce; color: #333; border-radius: 9px; padding: 0 7px; }
  .tabs a.active .pill { background: var(--primary); color: #fff; }

  .hint { font-size: 13px; color: var(--muted); margin: 0 2px 10px; display: flex; align-items: center; gap: 6px; }

  .slist { display: flex; flex-direction: column; gap: 8px; }
  .scard { display: flex; align-items: center; gap: 2px; padding: 6px 0; min-height: 72px; }
  .scard .handle { width: 40px; height: 56px; display: grid; place-items: center; color: #a5a5a5; flex: none; }
  .scard .num { width: 28px; height: 28px; border-radius: 50%; background: var(--primary-tint); color: var(--primary-dark); font-weight: 700; font-size: 14px; display: grid; place-items: center; flex: none; margin-right: 10px; }
  .scard .sbody { flex: 1; min-width: 0; }
  .sname { font-weight: 700; }
  .sdesc { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .sbadges { display: flex; gap: 12px; margin-top: 6px; font-size: 13px; color: #555; }
  .sbadges span { display: inline-flex; align-items: center; gap: 3px; }
  .scard.selected { outline: 2px solid var(--primary); background: #f7fbfe; }
  .addstage { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; border: 2px dashed #b9c7d3; border-radius: 10px; color: var(--primary); font-weight: 600; background: rgba(255,255,255,.6); }

  .field { margin-bottom: 16px; }
  .field label { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .field label .req { color: var(--danger); }
  .input { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; background: #fff; color: #222; }
  .input.placeholder { color: #999; }
  .input.area { min-height: 96px; }
  .input.tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px 8px; align-items: center; }
  .input.tags .chip { height: 30px; }
  .toggle { width: 52px; height: 32px; border-radius: 16px; background: var(--primary); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 3px; right: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  .dropzone { border: 2px dashed #c9c9c9; border-radius: 10px; min-height: 64px; display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: #777; font-size: 14px; }
  .file { display: flex; align-items: center; gap: 10px; min-height: 48px; border: 1px solid var(--border); border-radius: 8px; padding: 0 4px 0 12px; margin-bottom: 8px; }
  .file .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 20px; }
  .grid .full { grid-column: 1 / -1; }

  .editorbar { position: sticky; top: 0; background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 8px 4px 4px; border-bottom: 1px solid #e6e6e6; z-index: 2; }
  .editorbar .mid { flex: 1; text-align: center; font-size: 13px; color: var(--muted); }
  .saved { display: inline-flex; align-items: center; gap: 4px; color: var(--success); font-size: 13px; font-weight: 600; }

  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ddd; padding: 10px 12px 14px; display: flex; gap: 10px; z-index: 5; box-shadow: 0 -2px 8px rgba(0,0,0,.06); }
  .bottombar .btn { flex: 1; }

  /* Tables (tablet) */
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 13px; color: #444; font-weight: 700; padding: 0 10px; height: 44px; border-bottom: 2px solid #ddd; white-space: nowrap; }
  th .sorti { color: var(--primary); vertical-align: middle; }
  td { padding: 8px 10px; height: 60px; border-bottom: 1px solid #eee; vertical-align: middle; }
  td.name { font-weight: 700; }
  td.muted { color: var(--muted); font-size: 14px; }
  td.act { width: 52px; padding: 0 4px; text-align: right; }
  tr.hl td { background: #f6f9fc; }
  .more { color: var(--primary); font-weight: 600; font-size: 13px; }

  .split { display: grid; gap: 16px; align-items: start; }
  .panel-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-title h2 { font-size: 17px; margin: 0; }
</style>
</head>

  { name: 'New Journey', cats: ['Test'], roles: [], stages: 1, updated: '1 month ago' },
  { name: 'Test Journey', cats: ['Test'], roles: [], stages: 1, updated: '1 month ago' },
  { name: 'Foundations 2: The Life and Message of Jesus', cats: ['Waha', 'Foundations'], roles: [], stages: 2, updated: '2 months ago' },

const ROLES = ['Registered', 'Multiplier', 'Strategist', 'User Manager', 'Partner', 'Dispatcher', 'Digital Responder'];

const phoneTop = () => `<div class="topbar">${ic('menu')}<div class="logo"><b>⋀</b><div>DISCIPLE<small>TOOLS</small></div></div><div class="spacer"></div>${ic('search')}<div class="plus">${ic('plus', 'sm')}</div></div>`;
const tabletTop = () => `<div class="topbar"><div class="logo"><b>⋀</b><div>DISCIPLE<small>TOOLS</small></div></div><nav><span>Dashboard</span><span>Disciples</span><span>Groups</span><span>More ▾</span></nav><div class="spacer"></div>${ic('search')}<div class="plus">${ic('plus', 'sm')}</div>${ic('bell')}${ic('gear')}</div>`;

const roleSummary = (roles) => roles.length ? (roles.length > 2 ? `${roles.slice(0, 2).join(', ')} <span class="more">+${roles.length - 2}</span>` : roles.join(', ')) : '<span style="color:#aaa">All roles</span>';

const jcard = (j, extra = '') => `
  <div class="box jcard ${extra}">
    <div class="jmain">
      <div class="jtitle">${j.name}</div>
      <div class="jmeta">${j.cats.map(c => `<span class="chip">${c}</span>`).join('')}<span ${j.cats.length ? 'class="dot"' : ''}>${j.stages} stage${j.stages === 1 ? '' : 's'}</span></div>
      <div class="jsub">${j.roles.length ? j.roles.slice(0, 2).join(', ') + (j.roles.length > 2 ? ` +${j.roles.length - 2}` : '') + ' · ' : ''}Updated ${j.updated.toLowerCase()}</div>
    </div>
    <button class="iconbtn" aria-label="More actions">${ic('dots')}</button>
  </div>`;

const phoneListBody = (opts = {}) => `
  ${phoneTop()}
  <main class="page">
    <div class="titlebar"><h1>Journeys<span class="count">${opts.count || 6}</span></h1><button class="btn primary">${ic('plus', 'sm')} New</button></div>
    <div class="searchrow"><div class="search">${ic('search', 'sm')} Search journeys</div><button class="btn outline">${ic('filter', 'sm')} Filters${opts.filtered ? ' <span class="badge">1</span>' : ''}</button></div>
    ${opts.filtered ? `<div class="chips"><span class="chip removable">Foundations ${ic('close')}</span></div>` : ''}
    <div class="metaline"><span>${opts.count || 6} journeys</span><span class="sort">${ic('sort', 'sm')} Last modified</span></div>
    <div class="jlist">${(opts.list || JOURNEYS).map((j, i) => jcard(j, opts.pressed === i ? 'pressed' : '')).join('')}</div>
  </main>`;

const stageCard = (s, i, sel) => `
  <div class="box scard ${sel ? 'selected' : ''}">
    <div class="handle" title="Drag to reorder">${ic('drag')}</div>
    <div class="num">${i + 1}</div>
    <div class="sbody">
      <div class="sname">${s.name}</div>
      ${s.desc ? `<div class="sdesc">${s.desc}</div>` : ''}
      ${(s.l || s.a || s.r) ? `<div class="sbadges">${s.l ? `<span>${ic('link', 'sm')}${s.l}</span>` : ''}${s.a ? `<span>${ic('clip', 'sm')}${s.a}</span>` : ''}${s.r ? `<span>${ic('fields', 'sm')}${s.r}</span>` : ''}</div>` : ''}
    </div>
    <button class="iconbtn" aria-label="Stage actions">${ic('dots')}</button>
  </div>`;

const detailHeader = (title, opts = {}) => `
  <div class="subbar"><button class="back">${ic('left')} Journeys</button><button class="iconbtn ${opts.menuOn ? 'on' : ''}">${ic('dots')}</button></div>
  <h1 class="ptitle">${title}${opts.sub ? `<small>${opts.sub}</small>` : ''}</h1>`;

const tabs = (active, n) => `<div class="tabs"><a class="${active === 'details' ? 'active' : ''}">Details</a><a class="${active === 'stages' ? 'active' : ''}">Stages <span class="pill">${n}</span></a></div>`;

const stagesPanel = (sel) => `
  <div class="hint">${ic('drag', 'sm')} Drag to reorder, or use ${ic('dots', 'sm')} › Move up / down</div>

  </div>`;

const field = (label, value, opts = {}) => `
  <div class="field ${opts.full ? 'full' : ''}"><label>${label}${opts.req ? ' <span class="req">*</span>' : ''}</label>
  ${opts.raw || `<div class="input ${opts.area ? 'area' : ''} ${value ? '' : 'placeholder'}">${value || opts.ph || ''}</div>`}</div>`;

const detailsFields = (empty) => `
  ${field('Name', empty ? '' : 'Foundations 1: From Creation to the Birth of Jesus!', { req: true, ph: 'e.g. Discovery Bible Study' })}

  </main></div>`,

  'landscape-list': () => SCREENS['tablet-list']().replace('<tr class="">', '<tr class="">') + `
    <div class="toast">Copy of “Test Journey” created <button class="btn ghost">Open</button><button class="btn ghost">Undo</button></div>`,

  'landscape-detail': () => `<div class="tablet">${tabletTop()}<main class="page">

      <div><div class="panel-title" style="padding:0 2px"><h2>Stages <span class="count" style="font-weight:400;color:#666;font-size:14px">4</span></h2><button class="btn primary">${ic('plus', 'sm')} Add stage</button></div>${stagesPanel()}</div>
    </div>
  </main></div>`,

  'landscape-stage-edit': () => `<div class="tablet">${tabletTop()}<main class="page">
    ${detailHeader('Foundations 1: From Creation to the Birth of Jesus!', { sub: 'Waha · Foundations · Sequential' })}
    <div class="split" style="grid-template-columns: 0.85fr 1.35fr">
      <div><div class="panel-title" style="padding:0 2px"><h2>Stages <span class="count" style="font-weight:400;color:#666;font-size:14px">4</span></h2><button class="btn outline">${ic('plus', 'sm')} Add stage</button></div>${stagesPanel(1)}</div>
      <div class="box" style="overflow:hidden">
        <div class="editorbar" style="padding:8px 8px 8px 16px"><b style="font-size:17px">2. Creation of Humans</b><span class="mid" style="text-align:right;padding-right:6px"><span class="saved">${ic('check', 'sm')} Saved</span></span><button class="btn primary" style="min-height:40px">Done</button></div>
        <div class="pad"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${stageEditorFields()}</div></div>

const s = new URLSearchParams(location.search).get('s') || 'phone-list';
document.getElementById('app').innerHTML = (SCREENS[s] || (() => `<p style="padding:20px">Unknown screen: ${s}</p>`))();
document.title = 'Journeys Mockups — ' + s;
</script>
